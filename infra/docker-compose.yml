services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia
      POSTGRES_DB: elysia_financas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      # Unlike the build arg above (used by the browser), this is read at
      # runtime by the /auth, /users, /transactions… proxy in
      # frontend/server.ts (see frontend/proxy-paths.ts) — inside the
      # container "localhost" is the frontend itself, so it needs the
      # backend's service hostname on the compose network.
      VITE_API_URL: http://backend:4000
    ports:
      - "4001:4001"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
