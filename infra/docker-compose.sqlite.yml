services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/dev.db
    volumes:
      - sqlite_data:/data
    ports:
      - "4000:4000"
      # Prisma Studio (on demand, see `print_prisma_studio_hint` in
      # scripts/common.sh) — SQLite lives in a named volume visible
      # only inside the container, so Studio has to run there too.
      - "5555:5555"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      # Unlike the build arg above (used by the browser), this is read at
      # runtime by the /auth, /users, /transactions… proxy in
      # frontend/server.ts (see frontend/proxy-paths.ts) — inside the
      # container "localhost" is the frontend itself, so it needs the
      # backend's service hostname on the compose network.
      VITE_API_URL: http://backend:4000
    ports:
      - "4001:4001"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/.env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/dev.db
    volumes:
      - sqlite_data:/data
    depends_on:
      - backend

volumes:
  sqlite_data:
