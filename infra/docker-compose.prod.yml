services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: elysia_financas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:${POSTGRES_PASSWORD}@postgres:5432/elysia_financas
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN}
    environment:
      # Diferente do build arg acima (usado pelo navegador): esse é lido em
      # runtime pelo proxy de /auth, /users, /transactions etc. embutido em
      # frontend/server.ts (ver frontend/proxy-paths.ts) — dentro do container
      # o hostname do serviço na rede do compose evita um round-trip extra
      # pela internet/Caddy pra falar com um container no mesmo host.
      VITE_API_URL: http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
