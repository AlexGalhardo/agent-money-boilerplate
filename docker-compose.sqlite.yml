services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/dev.db
    volumes:
      - sqlite_data:/data
    ports:
      - "4000:4000"
      # Prisma Studio (sob demanda, ver `print_prisma_studio_hint` em
      # scripts/common.sh) — o SQLite fica num volume nomeado, só visível
      # de dentro do container, então o Studio também precisa rodar lá.
      - "5555:5555"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      # Diferente do build arg acima (usado pelo navegador): esse é lido em
      # runtime pelo proxy de /auth, /users, /transactions etc. embutido em
      # frontend/server.ts (ver frontend/proxy-paths.ts) — dentro do container
      # "localhost" seria o próprio frontend, não o backend, então precisa do
      # hostname do serviço na rede do compose.
      VITE_API_URL: http://backend:4000
    ports:
      - "4001:4001"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/.env
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/dev.db
    volumes:
      - sqlite_data:/data
    depends_on:
      - backend

volumes:
  sqlite_data:
