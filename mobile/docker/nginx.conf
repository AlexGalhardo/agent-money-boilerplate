# Rendered by nginx:alpine's envsubst at container start (${BACKEND_ORIGIN}).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # container healthcheck
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy: the web app calls /api/v1/... and nginx forwards
    # to the backend as /v1/... (trailing slash on proxy_pass strips /api).
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN}/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static assets — hash-named, safe to cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
