appId: com.elysiagalhardofinances.money
---
# Signs up a brand-new account (random e-mail so the flow is repeatable),
# confirms it lands on the dashboard, then logs out from "Minha Conta".
#
# Inputs are targeted by `id`, which matches TextField's default testID
# (`field-<label>`, src/components/ui/text-field.tsx); nav buttons by their
# `nav-*` testIDs (src/components/ui/bottom-nav.tsx).
- launchApp:
    clearState: true
- assertVisible: "Entrar"

- tapOn: "Criar conta"
- tapOn:
    id: "field-Nome"
- inputText: "Maestro"
- tapOn:
    id: "field-E-mail"
- inputRandomEmail
- tapOn:
    id: "field-Senha"
- inputText: "SenhaForte@123"
- hideKeyboard
- tapOn:
    text: "Criar conta"
    index: 1

# Sign-up goes straight to the dashboard once the account exists.
- assertVisible: "Olá, Maestro"

- tapOn:
    id: "nav-profile"
- assertVisible: "Minha Conta"
- scrollUntilVisible:
    element:
      text: "Sair da conta"
- tapOn: "Sair da conta"
# Native confirmation alert — match the button, not the alert title.
- tapOn:
    text: "^Sair$"
- assertVisible: "Entrar"
