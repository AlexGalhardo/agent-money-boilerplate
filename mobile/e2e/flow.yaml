# Full acceptance flow — ONLINE mode against the backend + sandbox providers.
#
# Precondition:
#   * backend running with test/sandbox keys (Stripe test mode, AbacatePay
#     sandbox, EMAIL_DRY_RUN=true) and reachable from the device
#   * app built/served with EXPO_PUBLIC_DATA_MODE=remote and
#     EXPO_PUBLIC_API_URL pointing at that backend
#   * an authenticator app / TOTP generator available, OR run with 2FA disabled
#     for the created account (the flow below covers the no-2FA path and marks
#     the 2FA leg as optional)
#
# Run: maestro test e2e/flow.yaml
appId: com.op.app
env:
  EMAIL: "e2e${maestro.timestamp}@example.com"
  PASSWORD: "secret123"
---
- launchApp:
    clearState: true

# --- 1. Cadastro ------------------------------------------------------------
- tapOn: "Criar conta"
- tapOn: { id: "field-E-mail" }
- inputText: "${EMAIL}"
- tapOn: { id: "field-Senha" }
- inputText: "${PASSWORD}"
- tapOn: { id: "field-Confirmar senha" }
- inputText: "${PASSWORD}"
- tapOn: "Criar conta"
- assertVisible: "Saldo do período"

# --- 2. Logout + login ----------------------------------------------------
- tapOn: "Sair"
- assertVisible: "Entrar"
- tapOn: { id: "field-E-mail" }
- inputText: "${EMAIL}"
- tapOn: { id: "field-Senha" }
- inputText: "${PASSWORD}"
- runFlow:
    when:
      visible: "Entrar"
    commands:
      - tapOn: "Entrar"
- assertVisible: "Saldo do período"

# --- 3. 2FA (optional leg) ------------------------------------------------
# Enrolling requires scanning the shown secret into a TOTP app; automate only
# if your runner injects a code. Left as a manual checkpoint.
- tapOn: "Perfil"
- tapOn: "Configurar"
- assertVisible: "Verificação em duas etapas"
- tapOn: "Voltar"
- tapOn: "Voltar"

# --- 4. Criar transação (offline) --------------------------------------
- setAirplaneMode: enabled
- tapOn: "Nova transação"
- tapOn: { id: "field-Valor" }
- inputText: "5000"            # R$ 50,00
- tapOn: "Mercado"
- tapOn: { id: "field-Descrição" }
- inputText: "Compra offline E2E"
- tapOn: "Adicionar"
- assertVisible: "Compra offline E2E"

# --- 5. Reconectar + verificar sync ----------------------------------
- setAirplaneMode: disabled
- pullToRefresh
- assertVisible: "Compra offline E2E"   # still present after reconnect + sync

# --- 6. Assinar plano (sandbox) ------------------------------------------
- tapOn: "Plano"
- assertVisible: "Assinatura"
- tapOn: "Anual"
- tapOn: "PIX"
- tapOn:
    text: "Assinar por.*"
    optional: false
- assertVisible: "PIX copia e cola"
# Confirm the sandbox charge out-of-band (AbacatePay dashboard "simulate
# payment" or POST /transparents/simulate-payment), then:
- tapOn: "Já paguei — atualizar status"

# --- 7. Verificar acesso liberado -------------------------------------
- assertVisible:
    text: "Acesso premium liberado"
    timeout: 20000
