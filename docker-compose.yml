services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia
      POSTGRES_DB: elysia_financas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "4001:4001"
    depends_on:
      - api

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
