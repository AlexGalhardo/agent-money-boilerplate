services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia
      POSTGRES_DB: elysia_financas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      # Diferente do build arg acima (usado pelo navegador): esse é lido em
      # runtime pelo proxy de /auth, /users, /transactions etc. embutido em
      # frontend/server.ts (ver frontend/proxy-paths.ts) — dentro do container
      # "localhost" seria o próprio frontend, não o backend, então precisa do
      # hostname do serviço na rede do compose.
      VITE_API_URL: http://backend:4000
    ports:
      - "4001:4001"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ./bot/.env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://elysia:elysia@postgres:5432/elysia_financas
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
